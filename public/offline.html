<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Çevrimdışı | Çağla Büfe & Market</title>
  <meta name="theme-color" content="#5D3EBC">
  <link rel="icon" href="/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f0d23;
      background-image: radial-gradient(circle at 50% 20%, #2e1065 0%, #0f0d23 80%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 27, 75, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 38px 26px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .icon-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: rgba(93, 62, 188, 0.3);
      color: #ffd10d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 1px solid rgba(255, 209, 13, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: #ffd10d;
      color: #191919;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(255, 209, 13, 0.3);
      transition: transform 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
      transition: background 0.15s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .btn-whatsapp {
      background: #25d366;
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
    }
    .btn-whatsapp:hover {
      background: #20bd5a;
    }
    .footer-note {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>
      KYK yurdunda veya oda içinde internetiniz kesilmiş olabilir. Bağlantınız geldiğinde sipariş ekranınız otomatik açılacaktır.
    </p>
    <button class="btn-primary" onclick="window.location.reload()">
      🔄 Yeniden Dene
    </button>
    <a id="phoneBtn" href="tel:05420007878" class="btn-secondary">
      📞 Büfeyi Doğrudan Ara
    </a>
    <a id="waBtn" href="https://wa.me/905420007878?text=Merhaba%20Cagla%20Bufe,%20internetim%20kesildi%20siparis%20vermek%20istiyorum" class="btn-secondary btn-whatsapp">
      💬 WhatsApp ile Hızlı Sipariş
    </a>
    <div class="footer-note">
      Çağla Büfe & Market • Karabük 100. Yıl & KYK Gece Servisi
    </div>
  </div>
  <script>
    // Auto-sync dynamic phone from stored settings if exists
    try {
      const stored = localStorage.getItem('caglabufe_system_settings_v1');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.storePhone) {
          const cleanPhone = parsed.storePhone.replace(/\s+/g, '');
          document.getElementById('phoneBtn').href = 'tel:' + cleanPhone;
        }
        if (parsed.storeWhatsApp) {
          const cleanWa = parsed.storeWhatsApp.replace(/[^\d]/g, '');
          document.getElementById('waBtn').href = 'https://wa.me/' + cleanWa + '?text=Merhaba%20Cagla%20Bufe,%20internetim%20kesildi%20siparis%20vermek%20istiyorum';
        }
      }
    } catch (e) {}

    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
