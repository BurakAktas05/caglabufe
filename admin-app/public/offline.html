<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Çevrimdışı | Çağla Büfe & Market</title>
  <meta name="theme-color" content="#5D3EBC">
  <link rel="icon" href="/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f8f9fc;
      color: #191919;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(93, 62, 188, 0.08);
      border: 1px solid #ebebf2;
    }
    .icon-box {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f3f0fe;
      color: #5D3EBC;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #191919;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #586174;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 14px;
      background: #5D3EBC;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(93, 62, 188, 0.25);
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: #25D366;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #8b95a5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>
      KYK yurdunda veya bina içinde internet bağlantınız kopmuş olabilir. Bağlantınız geldiğinde uygulama otomatik güncellenecektir.
    </p>
    <button class="btn-primary" onclick="window.location.reload()">
      Yeniden Dene
    </button>
    <a href="tel:05440000000" class="btn-secondary" style="background: #3b82f6; margin-bottom: 8px;">
      📞 Çağla Büfe'yi Doğrudan Ara
    </a>
    <a href="https://wa.me/905440000000?text=Merhaba%20Cagla%20Bufe,%20internetim%20cekmiyor%20siparis%20vermek%20istiyorum" class="btn-secondary">
      💬 WhatsApp ile Hızlı Sipariş
    </a>
    <div class="footer-note">
      Çağla Büfe & Market • Karabük 100. Yıl & KYK
    </div>
  </div>
  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
